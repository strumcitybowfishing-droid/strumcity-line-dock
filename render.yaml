# Deploy on Render.com: New + → Blueprint → connect this repo (easiest)
# Or use manual Web Service with the settings below.
# plan: standard in YAML (always-on). If you only paid for Starter, the dashboard plan takes precedence — see README for details on Starter sleep behavior and how to keep site up.
services:
  - type: web
    name: strumcity-line-dock
    runtime: python
    plan: standard
    buildCommand: ""
    startCommand: python -u server.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"